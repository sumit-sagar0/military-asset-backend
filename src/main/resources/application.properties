spring.application.name=assetmanager

# ── Database Configuration ──────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/military_asset_db;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# JPA / Hibernate - auto-detect dialect (Spring Boot 3 does this automatically)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (local dev only)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JWT
jwt.secret=${JWT_SECRET:7d6c669b35b6b6b7a54b6c3d4a4d6f3e5c5c6f3d4a3e5b3c4d5a6b7c8d9e0f1a}
jwt.expiration=86400000

# Server
server.port=${PORT:8080}

# Actuator health check
management.endpoints.web.exposure.include=health
